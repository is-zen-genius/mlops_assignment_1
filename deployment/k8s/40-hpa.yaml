# Bonus beyond the assignment minimum: autoscale on CPU so traffic spikes (see
# scripts/simulate_traffic.py) are handled automatically. Needs metrics-server in the cluster.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: heart-risk-api
  namespace: heart-risk
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: heart-risk-api
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
