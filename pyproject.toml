[project]
name = "heart-risk-mlops"
version = "1.0.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI's Depends()/Body() defaults rely on call-in-default-arg

[tool.ruff.lint.isort]
known-first-party = ["heart_risk"]
